<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- These two values are also set from js/config.js, but keeping them here
       helps search engines that read the raw HTML. Edit both if you like. -->
  <title>Mattia Sabella — Personal Page</title>
  <meta name="description" content="Personal page: research, publications and industry experience.">

  <!-- Small black-square favicon, drawn inline so there is no extra file. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0b'/><rect x='9' y='9' width='14' height='14' fill='%23fff'/></svg>">

  <!-- Fonts: IBM Plex (engineering heritage) + Space Grotesk for display type. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Lets keyboard users jump straight past the navigation. -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== HEADER =================================================== -->
  <!-- The links inside .nav-list are generated by js/main.js from the
       "sections" array in js/config.js. You never edit this by hand. -->
  <header class="header">
    <div class="wrap header-inner">

      <a class="brand" href="#home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name">Mattia Sabella</span>
      </a>

      <nav class="nav" aria-label="Main">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>

      <div class="header-tools">
        <!-- Switches the page between light and dark grayscale. -->
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
          <span class="icon-btn-label" id="theme-label">Dark</span>
        </button>

        <!-- Only visible on small screens. -->
        <button class="icon-btn menu-btn" id="menu-toggle" type="button"
                aria-label="Open menu" aria-expanded="false" aria-controls="nav-list">
          <span class="menu-bars" aria-hidden="true"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- ===== SECTIONS ================================================= -->
  <!-- Every section is rendered into this container by js/main.js,
       in the same order as the "sections" array in js/config.js. -->
  <main id="main"></main>

  <!-- ===== FOOTER =================================================== -->
  <footer class="footer">
    <div class="wrap footer-inner">
      <p class="footer-text" id="footer-text"></p>
      <a class="footer-top" href="#home">Back to top</a>
    </div>
  </footer>

  <!-- config.js must load first: main.js reads the values from it. -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
